<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Nombres</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="pagina-formulario">
    <div class="tarjeta tarjeta-nombres">
        <form method="POST">
            <label for="nombre1">Nombre 1:</label>
            <input type="text" id="nombre1" name="nombre1"
                   value="{{ request.form.get('nombre1', '') }}" required>

            <label for="nombre2">Nombre 2:</label>
            <input type="text" id="nombre2" name="nombre2"
                   value="{{ request.form.get('nombre2', '') }}" required>

            <label for="nombre3">Nombre 3:</label>
            <input type="text" id="nombre3" name="nombre3"
                   value="{{ request.form.get('nombre3', '') }}" required>

            <button type="submit" class="btn-enviar">Enviar</button>
        </form>

        {% if nombre_mayor is not none %}
        <div class="resultado-nombres">
            <p>El nombre con mayor cantidad de caracteres es : {{ nombre_mayor }}</p>
            <p>El nombre tiene : {{ cantidad_caracteres }} caracteres</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
